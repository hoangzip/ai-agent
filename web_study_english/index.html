<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZipH English AI - Học 1760 Từ Vựng Tiếng Anh Thông Minh</title>
  <meta name="description" content="Website học từ vựng Tiếng Anh theo 60 chủ đề sinh động, phát âm chuẩn giọng Mỹ sử dụng AI và Web Speech API. Giao diện trực quan hiện đại phong cách Neo-brutalism.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23E85D44%22/><text y=%22.9em%22 font-size=%2290%22 fill=%22%23FFF%22>✦</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <div id="app">
    <!-- App loading spinner -->
    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background-color: #FAF9F5; font-family: 'Outfit', sans-serif;">
      <div style="width: 50px; height: 50px; border: 5px solid #000; border-top-color: #E85D44; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
      <div style="font-weight: 800; font-size: 20px;">Đang tải dữ liệu 1760 từ vựng...</div>
      
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
  </div>

  <!-- Load main script as ES Module -->
  <script type="module" src="app.js"></script>

</body>
</html>
